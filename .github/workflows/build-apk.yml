name: Build & publish APK

# Builds the signed release APK and uploads it to GitHub Releases:
#   • push a tag (v0.1.0, …) → a permanent release with that version
#   • push to main / manual run → a rolling "latest" release with a stable URL
# The APK is signed with the committed android/keystore.properties key, so
# every build installs over older versions. No secrets required.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build release APK (arm64 + armv7)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          NAME="HulogTrack-v${VERSION}-${GITHUB_SHA::7}.apk"
          cp "$APK" "/tmp/$NAME"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tagged build → dedicated, permanent release for that version.
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "/tmp/$NAME" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "/tmp/$NAME" \
                --title "HulogTrack $GITHUB_REF_NAME" \
                --notes "Signed release APK. Install on Android: download the file and open it (allow \`Install from unknown sources\`)."
            fi
          else
            # Default-branch build → rolling "latest" release, stable URL:
            #   https://github.com/<owner>/<repo>/releases/latest/download/HulogTrack-latest.apk
            gh release delete latest --yes >/dev/null 2>&1 || true
            if ! gh release create latest "/tmp/$NAME#HulogTrack-latest.apk" \
              --title "HulogTrack (latest)" \
              --notes "Rolling build from the default branch. Download **HulogTrack-latest.apk** and open it on your phone (allow \`Install from unknown sources\`)." \
              2>/dev/null; then
              # Another push got here first — attach to the surviving release.
              gh release upload latest "/tmp/$NAME#HulogTrack-latest.apk" --clobber || true
            fi
          fi
