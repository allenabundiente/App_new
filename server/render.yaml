services:
  - type: web
    name: hulogtrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false 
      - key: TOKEN_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SEED_ON_BOOT
        value: "1"
      - key: REMINDER_INTERVAL_MIN
        value: "15"
      - key: CORS_ORIGINS
        value: "*"
